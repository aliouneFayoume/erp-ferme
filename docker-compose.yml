services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Nom explicite plutôt que de dépendre du nom du dossier de déploiement (docker compose en
    # dérive un sinon) : le workflow de déploiement (deploy.yml) tague cette image par SHA de
    # commit pour permettre un rollback rapide (audit systèmes/développement 2026-08-11) — un nom
    # implicite qui changerait selon le chemin de clonage casserait ce mécanisme silencieusement.
    image: erp-ferme-app:latest
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - PORT=4000
    expose:
      - "4000"
    # Décommenter pour exposer directement sans nginx (utile en test) :
    # ports:
    #   - "4000:4000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
