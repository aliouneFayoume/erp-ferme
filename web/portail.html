<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace client — Massla</title>
  <link rel="icon" href="/icons/massla-favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0F3D2E" />
  <link rel="preload" href="/fonts/Onest-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/massla-tokens.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <img class="login-logo" src="/icons/massla-empile-blanc.svg" alt="Massla" />
      <p class="login-ferme hidden" data-brand></p>
      <h1>Espace client</h1>
      <p class="sub">Suivez vos commandes, vos factures et vos demandes.</p>
      <form id="login-form">
        <label>Téléphone
          <input type="tel" name="telephone" required autocomplete="tel" placeholder="+221 77 123 45 67" />
        </label>
        <label>Code d'accès
          <input type="text" name="pin" required inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
        </label>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit">Se connecter</button>
      </form>
      <p class="sub" style="margin-top:16px;">Le code d'accès vous est communiqué par la ferme.</p>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <header class="top">
      <div>
        <div class="brand">Massla</div>
        <div class="sub">Espace client</div>
      </div>
      <div class="who">
        <div id="who-name"></div>
        <div style="margin-top:8px;"><button class="secondary" id="btn-logout">Déconnexion</button></div>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main id="view"></main>
  </div>

  <script src="/js/dist/portail.min.js"></script>
</body>
</html>
