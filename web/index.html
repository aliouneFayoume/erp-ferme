<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Ferme Massla</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="theme-color" content="#2E2A22" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h1>Ferme Massla</h1>
      <p class="sub">Système de gestion — Avicole · Piscicole · Maraîcher</p>
      <form id="login-form">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Mot de passe
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit">Se connecter</button>
      </form>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <header class="top">
      <div>
        <div class="brand">Ferme Massla</div>
        <div class="sub">Avicole · Piscicole · Maraîchage · Finances · Logistique</div>
      </div>
      <div class="who">
        <div id="who-name"></div>
        <span id="who-role" class="role-pill"></span>
        <span id="sync-badge" class="badge warn hidden" title="Actions en attente d'envoi au serveur"></span>
        <div style="margin-top:8px;"><button class="secondary" id="btn-logout">Déconnexion</button></div>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main id="view"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/offline-queue.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/production.js"></script>
  <script src="/js/views/catalogue.js"></script>
  <script src="/js/views/clients.js"></script>
  <script src="/js/views/abonnements.js"></script>
  <script src="/js/views/commandes.js"></script>
  <script src="/js/views/logistique.js"></script>
  <script src="/js/views/finance.js"></script>
  <script src="/js/views/comptabilite.js"></script>
  <script src="/js/views/utilisateurs.js"></script>
  <script src="/js/views/audit.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
