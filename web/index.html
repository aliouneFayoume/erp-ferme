<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERP Ferme Massla</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <meta name="theme-color" content="#1A1A1A" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h1 data-brand>Ferme Massla</h1>
      <p class="sub">Système de gestion — Avicole · Piscicole · Maraîcher</p>
      <form id="login-form">
        <label>Email
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>Mot de passe
          <input type="password" name="password" required autocomplete="current-password" />
        </label>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit">Se connecter</button>
      </form>
      <p class="sub" style="margin-top:16px;">Nouveau client ? <a href="/inscription.html">Créer votre ferme</a></p>
      <p class="sub" style="margin-top:4px;"><a href="/decouvrir">En savoir plus sur l'application</a></p>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="btn-menu-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-brand" id="topbar-brand">Ferme Massla</div>
      <div class="topbar-who">
        <button class="secondary hidden" id="btn-retour-supervision">↩ Retour à la supervision</button>
        <span id="sync-indicator" class="sync-indicator synced" title="Toutes les actions sont synchronisées">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.6A4.5 4.5 0 0 0 6.5 19h11Z"/>
          </svg>
          <span class="sync-count hidden" id="sync-count"></span>
        </span>
        <span id="who-name"></span>
        <span id="who-role" class="role-pill"></span>
        <button class="secondary" id="btn-logout">Déconnexion</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <nav id="tabs"></nav>
        <button class="sidebar-collapse-toggle" id="btn-sidebar-collapse" aria-label="Réduire le menu" title="Réduire le menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          <span>Réduire</span>
        </button>
      </aside>
      <div class="sidebar-overlay hidden" id="sidebar-overlay"></div>
      <main id="view"></main>
    </div>
  </div>

  <script src="/js/branding.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/offline-queue.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/production.js"></script>
  <script src="/js/views/catalogue.js"></script>
  <script src="/js/views/clients.js"></script>
  <script src="/js/views/abonnements.js"></script>
  <script src="/js/views/commandes.js"></script>
  <script src="/js/views/fournisseurs.js"></script>
  <script src="/js/views/logistique.js"></script>
  <script src="/js/views/finance.js"></script>
  <script src="/js/views/comptabilite.js"></script>
  <script src="/js/views/tickets.js"></script>
  <script src="/js/views/parametres-paiement.js"></script>
  <script src="/js/views/utilisateurs.js"></script>
  <script src="/js/views/audit.js"></script>
  <script src="/js/views/plateforme.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
