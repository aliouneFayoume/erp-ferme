# Reverse proxy nginx -> conteneur app (port 4000).
server {
    listen 80;
    server_name massla.sn www.massla.sn;

    # Requis par certbot pour valider le domaine avant d'obtenir/renouveler un certificat TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste du trafic HTTP est redirigé vers HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name massla.sn www.massla.sn;
    ssl_certificate     /etc/letsencrypt/live/massla.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massla.sn/privkey.pem;

    location / {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
