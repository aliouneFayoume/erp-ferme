# Durcissement 2026-10 : limitation de débit par IP. nginx est le seul saut devant l'app (l'app fait
# trust proxy = 1), donc $binary_remote_addr EST l'IP réelle du client. Si un CDN/proxy (ex. Cloudflare)
# est un jour placé devant nginx, il faudra le module realip, sinon tous les clients partageraient
# l'IP du CDN et seraient limités ensemble. Les zones sont dans le contexte http (conf.d/ y est inclus).
# Zone générale généreuse : une page de l'app enchaîne beaucoup de requêtes API/statiques.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
# Zone stricte pour l'authentification (brute force login/MFA/reset) ; s'ajoute aux limiteurs de l'app.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
# 429 (et non le 503 par défaut) : sémantique correcte pour les clients et la supervision.
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=connexions:10m;

# Reverse proxy nginx -> conteneur app (port 4000).
# Ce fichier est chargé dans le contexte http (conf.d/default.conf), d'où le map ci-dessous.
map $host $massla_robots {
    default     "noindex, nofollow";
    massla.sn   "";
}

# *.massla.sn (sous-domaine par ferme, voir routes/public.js côté app) : le certificat couvre
# désormais massla.sn + *.massla.sn (wildcard, obtenu via DNS-01/OVH — un wildcard TLS couvre déjà
# www.massla.sn, pas besoin de le lister à part). L'app elle-même route tout sous-domaine vers le
# même service ; c'est req.hostname (Host transmis ci-dessous) qui distingue la ferme visitée.
server {
    listen 80;
    server_name massla.sn www.massla.sn *.massla.sn;

    # Requis par certbot pour valider le domaine avant d'obtenir/renouveler un certificat TLS
    # (utilisé seulement pour l'éventuel fallback HTTP-01 — le renouvellement du wildcard passe par
    # DNS-01/OVH, voir deploy/certbot-renew.sh).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste du trafic HTTP est redirigé vers HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# www.massla.sn -> massla.sn (301) : une seule adresse pour chaque page, sinon Google voit le site en double
# (le wildcard TLS couvre déjà www, voir plus haut).
server {
    listen 443 ssl;
    server_name www.massla.sn;
    ssl_certificate     /etc/letsencrypt/live/massla.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massla.sn/privkey.pem;
    return 301 https://massla.sn$request_uri;
}

server {
    listen 443 ssl;
    server_name massla.sn *.massla.sn;
    ssl_certificate     /etc/letsencrypt/live/massla.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massla.sn/privkey.pem;

    # Compression : sans elle, le JS de l'app (≈ 220 Ko) part tel quel ; compressé il pèse ≈ 55 Ko, ce qui compte
    # sur une connexion 3G (HTML toujours compressé quand gzip est actif ; la police woff2 l'est déjà).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Durcissement 2026-10 : taille maximale d'un corps de requête. L'app n'accepte aucun upload de
    # fichier ; express.json()/urlencoded() plafonnent à 100 Ko côté serveur. 1m laisse une large
    # marge tout en coupant très tôt les envois abusifs (nginx répond 413 sans solliciter Node).
    client_max_body_size 1m;

    # Anti-slowloris : un client qui envoie en-têtes/corps au compte-gouttes monopolise une connexion.
    # 15 s suffit pour une connexion 3G lente ; proxy_read_timeout (réponses lentes de l'app, ex. PDF,
    # assistant IA) reste volontairement à sa valeur par défaut.
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;
    keepalive_timeout     30s;
    # Plafond de connexions simultanées par IP (large : plusieurs onglets / NAT d'opérateur).
    limit_conn connexions 50;
    limit_conn_status 429;

    # Authentification : débit strict. burst 10 + nodelay = une rafale légitime (login + MFA + retry)
    # passe, un robot est coupé. Les proxy_set_header sont répétés (pas d'héritage entre locations).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # IPN PayDunya (paiements des fermes ET abonnements SaaS, même URL) : aucun limit_req volontairement.
    # Les notifications viennent de quelques IP de PayDunya, parfois en rafale ; en rejeter une ferait
    # perdre une confirmation de paiement. L'app a déjà son limiteur (limiteurIPN) + vérification
    # croisée de l'IPN. limit_req étant déclaré par location (pas au niveau server), ce bloc n'en hérite pas.
    location = /api/finance/paiements/ipn {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sonde de santé (monitor.sh, déploiement, HEALTHCHECK) : jamais limitée.
    location = /api/health {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les sous-domaines de ferme (<slug>.massla.sn) servent les mêmes pages que massla.sn : on les garde hors de
    # l'index Google (seul massla.sn doit y figurer). add_header n'est pas autorisé dans un « if » au niveau server,
    # d'où la variable $massla_robots (voir le map en tête de fichier) ; une valeur vide n'envoie aucun en-tête.
    add_header X-Robots-Tag $massla_robots always;

    location / {
        # Zone générale : 20 r/s par IP, rafale de 40 sans délai.
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
