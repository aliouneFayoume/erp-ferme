# Reverse proxy nginx -> conteneur app (port 4000). Remplacer "votre-domaine.tld" une fois le
# domaine choisi et son DNS pointé vers l'IP du VPS.
server {
    listen 80;
    server_name votre-domaine.tld;

    # Requis par certbot pour valider le domaine avant d'obtenir un certificat TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

